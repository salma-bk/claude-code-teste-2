services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    ports:
      - "5433:5432"
    volumes:
      - planner_db_data:/var/lib/postgresql/data

volumes:
  planner_db_data:
